<title>PoliCycle - Help</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #555;
    --border: #ccc;
    --code-bg: #f0f0f0;
    --surface: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #eee;
      --muted: #aaa;
      --border: #444;
      --code-bg: #2a2a2a;
      --surface: #1b1b1b;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 1rem 1rem 3rem;
    line-height: 1.55;
    color: var(--text);
    background: var(--surface);
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--text);
    padding-bottom: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .app-icon {
    height: 2.4rem;
    width: auto;
    display: block;
  }
  h1 { margin: 0; font-size: 1.5rem; }
  h2 { margin-top: 2rem; margin-bottom: 0.5rem; font-size: 1.15rem; }
  p { margin: 0.5rem 0; }
  ul { margin: 0.5rem 0; padding-left: 1.3rem; }
  li { margin: 0.3rem 0; }
  code {
    background: var(--code-bg);
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    font-size: 0.9em;
  }
  select {
    font-size: 0.9rem;
    padding: 0.3rem 0.5rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .muted { color: var(--muted); font-size: 0.9em; }
</style>
</head>

    <select id="langSelect" aria-label="Language"></select>
  </div>
  <div id="content"></div>

      ] },
      { h: 'Compartir mediante URL', p: [
        'La barra de direcciones siempre refleja el caso de uso actual completo, comprimido y codificado en la URL. Copie y envíe esa URL a otra persona; al abrirla se reproduce exactamente el mismo caso de uso para ella - no se necesita archivo ni servidor.',
        'Esto depende de funciones de compresión integradas en los navegadores modernos; en un navegador muy antiguo, la barra de direcciones puede simplemente no actualizarse, sin afectar al resto de la aplicación.'
      ] }
    ]
  }
};

function detectLocale() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved && SUPPORTED.includes(saved)) return saved;
  const browserLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const lang of browserLangs) {
    const short = lang.slice(0, 2).toLowerCase();
    if (SUPPORTED.includes(short)) return short;
  }
  return 'en';
}

function render(locale) {
  const dict = T[locale] || T.en;
  document.documentElement.lang = locale;
  document.title = dict.pageTitle;
  document.getElementById('pageTitle').textContent = dict.pageTitle;

  const content = document.getElementById('content');
  content.innerHTML = dict.sections.map(section => {
    const paras = (section.p || []).map(t => `<p>${t}</p>`).join('');
    const list = section.list ? `<ul>${section.list.map(li => `<li>${li}</li>`).join('')}</ul>` : '';
    const paras2 = (section.p2 || []).map(t => `<p>${t}</p>`).join('');
    return `<h2>${section.h}</h2>${paras}${list}${paras2}`;
  }).join('');
}

const select = document.getElementById('langSelect');
SUPPORTED.forEach(code => {
  const opt = document.createElement('option');
  opt.value = code;
  opt.textContent = LANG_NAMES[code];
  select.appendChild(opt);
});

const initialLocale = detectLocale();
select.value = initialLocale;
render(initialLocale);

select.addEventListener('change', () => {
  localStorage.setItem(STORAGE_KEY, select.value);
  render(select.value);
});
</script>
</body>
</html>
